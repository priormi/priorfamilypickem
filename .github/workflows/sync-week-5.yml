name: Sync NFL Week 5

on:
  workflow_dispatch:

jobs:
  sync-week-5:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke Supabase NFL week 5 sync
        env:
          SUPABASE_FUNCTION_URL: ${{ secrets.SUPABASE_FUNCTION_URL }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          test -n "$SUPABASE_FUNCTION_URL"
          curl --fail-with-body --request POST "$SUPABASE_FUNCTION_URL/sync-nfl" \
            --header "authorization: Bearer $SYNC_SECRET" \
            --header "content-type: application/json" \
            --data '{"source":"github-actions","weeks":[5]}'
